<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* One-time purge of MSAL tokens minted against the old Vanrock tenant. Bumping
   the version string re-runs it for everyone. Left in place from the July 2026
   carve-out -- harmless once run, and removing it would strand anyone who has
   not opened the app since. */
(function(){try{var V="ns-renewals-2026-09";if(localStorage.getItem("ns_renewals_ver")!==V){[localStorage,sessionStorage].forEach(function(s){try{Object.keys(s).forEach(function(k){var lk=k.toLowerCase();if(lk.indexOf("msal")>-1||lk.indexOf("login.windows")>-1||lk.indexOf("32e75ffa")>-1)s.removeItem(k)})}catch(e){}});localStorage.setItem("ns_renewals_ver",V)}}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewShire — Renewals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --hdr:#1C3740; --gold:#CDA04B; --gold-lt:#F8F0DB; --gold-dk:#9E7B2F;
  --teal:#28434C; --teal2:#2F5260; --teal5:#EDF4F7; --teal1:#D6E7EC;
  --page:#F5F7F7; --white:#fff;
  --g1:#E8EAEA; --g2:#D0D8DC; --g3:#A8B0B0; --g4:#7A8585; --g6:#3E4A4A;
  --ok:#2D8A5A;  --okb:#EAF5EF;  --okd:#BFE0CE;
  --er:#C44B3B;  --erb:#FBEEEC;  --erd:#EFC9C2;
  --wa:#B8820A;  --wab:#FDF4E0;  --wad:#EDD6A0;
  --inf:#4A78B0; --infb:#EDF2F9; --infd:#C6D6EA;
  --f:'Source Sans 3','Segoe UI',sans-serif; --m:'Source Code Pro',Consolas,monospace;
  --r:9px;
}
body{font-family:var(--f);background:var(--page);color:var(--teal);font-size:13.5px;line-height:1.45;min-height:100vh}
button{font-family:var(--f)}
input,select,textarea{font-family:var(--f)}

/* ── AUTH ─────────────────────────────────────────────── */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.auth-card{background:var(--white);border:1px solid var(--g1);border-radius:14px;padding:40px;text-align:center;max-width:370px;width:90%;box-shadow:0 6px 28px rgba(28,55,64,.09)}
.auth-logo{width:58px;height:58px;border-radius:12px;background:var(--hdr);border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:23px;font-weight:700;color:#fff}
.auth-title{font-size:19px;font-weight:700;margin-bottom:5px}
.auth-sub{font-size:12.5px;color:var(--g4);margin-bottom:26px}
.btn-login{width:100%;padding:12px;border:none;border-radius:var(--r);background:var(--hdr);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-login:hover{background:#264753}
.auth-err{color:var(--er);font-size:11.5px;margin-top:12px;line-height:1.5}
.login-wrap.hidden{display:none}
.app-wrap{display:none}.app-wrap.on{display:block}

/* ── TOPBAR ───────────────────────────────────────────── */
.topbar{background:var(--hdr);border-bottom:2px solid var(--gold);height:52px;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:50}
.tb-mark{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-name{color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap}
.tabs{display:flex;height:52px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{color:rgba(255,255,255,.55);font-size:12.5px;padding:0 15px;height:100%;display:flex;align-items:center;gap:6px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.tab-ct{background:rgba(255,255,255,.16);border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.tab.on .tab-ct{background:var(--gold);color:var(--hdr)}
.tab-ct.urgent{background:var(--er);color:#fff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-who{font-size:11px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3}
.tb-who b{display:block;color:#fff;font-size:12px;font-weight:600}
.tb-btn{font-size:11.5px;padding:5px 11px;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer}
.tb-btn:hover{background:rgba(255,255,255,.1);color:#fff}

/* ── PAGE / PANES ─────────────────────────────────────── */
.page{padding:16px 18px 60px;max-width:1500px;margin:0 auto}
.pane{display:none}.pane.on{display:block}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ptitle{font-size:18px;font-weight:700;letter-spacing:-.01em}
.psub{font-size:12.5px;color:var(--g4);margin-top:3px;max-width:640px}
.pstamp{font-size:11px;color:var(--g3);white-space:nowrap}

/* ── METRIC STRIP ─────────────────────────────────────── */
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mc{background:var(--white);border:1px solid var(--g1);border-radius:var(--r);padding:9px 15px;min-width:104px}
.mc.click{cursor:pointer;transition:border-color .13s,box-shadow .13s}
.mc.click:hover{border-color:var(--g2);box-shadow:0 2px 8px rgba(28,55,64,.07)}
.mc.sel{border-color:var(--hdr);box-shadow:0 0 0 1px var(--hdr)}
.mcl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g3);margin-bottom:3px;white-space:nowrap}
.mcv{font-size:21px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.mcv.g{color:var(--ok)}.mcv.w{color:var(--wa)}.mcv.r{color:var(--er)}.mcv.b{color:var(--inf)}
.mcs{font-size:10.5px;color:var(--g4);margin-top:3px}

/* ── FILTER BAR ───────────────────────────────────────── */
.fbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--white);border:1px solid var(--g1);border-radius:var(--r);padding:9px 12px;margin-bottom:14px}
.flbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g3)}
.fsel,.finp{font-size:12.5px;padding:5px 9px;border:1px solid var(--g2);border-radius:6px;background:var(--white);color:var(--teal);outline:none}
.fsel:focus,.finp:focus{border-color:var(--hdr)}
.finp.search{min-width:210px}
.seg{display:flex;border:1px solid var(--g2);border-radius:6px;overflow:hidden}
.seg button{font-size:12px;font-weight:500;padding:5px 12px;background:var(--white);border:none;cursor:pointer;color:var(--g4);border-right:1px solid var(--g2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--hdr);color:#fff;font-weight:600}
.fspacer{margin-left:auto;font-size:11.5px;color:var(--g4)}
.fsel.urgsel:not([data-any]){}

/* ── OWNER BATCH CARDS ────────────────────────────────── */
.ocard{background:var(--white);border:1px solid var(--g1);border-radius:11px;margin-bottom:13px;overflow:hidden}
.ocard.esc{border-color:var(--erd);box-shadow:0 0 0 1px var(--erd)}
.ohead{display:flex;align-items:center;gap:13px;padding:11px 15px;background:linear-gradient(180deg,#FBFCFC,#F4F7F8);border-bottom:1px solid var(--g1);flex-wrap:wrap;cursor:pointer}
.ohead:hover{background:#F0F5F6}
.ocaret{font-size:10px;color:var(--g3);width:11px;flex-shrink:0;transition:transform .15s}
.ocard.collapsed .ocaret{transform:rotate(-90deg)}
.ocard.collapsed .obody{display:none}
.oname{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.ometa{font-size:11.5px;color:var(--g4);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ometa a{color:var(--inf);text-decoration:none}
.ometa a:hover{text-decoration:underline}
.oright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.obody{padding:0}
.ocopy{font-size:11px;padding:4px 10px;border:1px solid var(--g2);border-radius:6px;background:var(--white);color:var(--g6);cursor:pointer;white-space:nowrap}
.noterow{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;background:var(--gold-lt);border-bottom:1px solid var(--nrd)}
.noterow.empty{background:transparent;border-bottom:1px solid var(--g1);padding:5px 15px;justify-content:flex-end}
.noterow .notes{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.note{font-size:12px;line-height:1.5;color:#7A5C1E}
.notelbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-dk);margin-right:7px}
.notetxt{white-space:pre-wrap}
.notebtn{font-size:10.5px;padding:3px 9px;border:1px solid var(--nrd);border-radius:5px;background:var(--white);color:var(--gold-dk);cursor:pointer;white-space:nowrap;flex-shrink:0}
.notebtn:hover{background:var(--gold-lt);border-color:var(--gold)}
.noterow.empty .notebtn{border-color:var(--g2);color:var(--g4);background:transparent}
.noterow.empty .notebtn:hover{border-color:var(--g3);color:var(--g6)}
.offtbl{width:100%}
.offtbl td{padding:5px 6px;border-bottom:1px solid var(--g1);vertical-align:middle}
.offtbl tr:last-child td{border-bottom:none}
.offterm{font-size:12.5px}
.offend{font-size:11px;color:var(--g4);white-space:nowrap}
.offrent{text-align:right;width:96px}
.offdelta{text-align:right;white-space:nowrap;width:110px}
.ocopy:hover{border-color:var(--hdr);color:var(--hdr)}

/* ── TABLES ───────────────────────────────────────────── */
.tw{background:var(--white);border:1px solid var(--g1);border-radius:11px;overflow:hidden;margin-bottom:14px}
.tscr{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--g1);text-align:left;white-space:nowrap;background:var(--teal5);color:var(--teal2);vertical-align:bottom}
thead th.num{text-align:right}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--hdr)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--g1);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#F7FAFB}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--m);font-size:12px}
.rowsub{display:block;font-size:10.5px;color:var(--g4);font-weight:400;margin-top:1px;white-space:nowrap}
.tempty{padding:44px 20px;text-align:center;color:var(--g4);font-size:13px}
.tempty .big{font-size:30px;display:block;margin-bottom:9px;opacity:.5}

/* ── BADGES / PILLS ───────────────────────────────────── */
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;text-transform:uppercase}
.b-ok{background:var(--okb);color:#1C6B44;border:1px solid var(--okd)}
.b-wa{background:var(--wab);color:#8A6207;border:1px solid var(--wad)}
.b-er{background:var(--erb);color:#9B2E20;border:1px solid var(--erd)}
.b-inf{background:var(--infb);color:#2E5586;border:1px solid var(--infd)}
.b-gr{background:#F0F2F2;color:var(--g4);border:1px solid var(--g1)}
.b-gold{background:var(--gold-lt);color:var(--gold-dk);border:1px solid #E8D098}
.flag{display:inline-flex;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:4px;white-space:nowrap}
.fl-er{background:var(--erb);color:#9B2E20}
.fl-wa{background:var(--wab);color:#8A6207}
.fl-inf{background:var(--infb);color:#2E5586}

/* ── BUTTONS ──────────────────────────────────────────── */
.btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;border:1px solid var(--g2);background:var(--white);color:var(--g6);cursor:pointer;white-space:nowrap;transition:all .13s}
.btn:hover{border-color:var(--g3);background:#FAFBFB}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--hdr);border-color:var(--hdr);color:#fff}
.btn.pri:hover{background:#264753}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#26744C}
.btn.dgr{color:var(--er);border-color:var(--erd)}
.btn.ovr{color:var(--gold-dk);border-color:var(--wad);background:var(--wab)}
.btn.ovr:hover{background:var(--gold-lt);border-color:var(--gold)}
.btn.dgr:hover{background:var(--erb)}
.btn.sm{font-size:11px;padding:3px 9px}
.btnrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ── RENT INPUT ───────────────────────────────────────── */
.rent-in{width:78px;font-family:var(--m);font-size:12.5px;padding:4px 7px;border:1px solid var(--g2);border-radius:6px;text-align:right;outline:none;background:var(--white)}
.rent-in:focus{border-color:var(--hdr);box-shadow:0 0 0 2px rgba(28,55,64,.09)}
.rent-in.dirty{border-color:var(--gold);background:#FFFDF6}
.delta{font-size:10.5px;font-weight:600;font-family:var(--m)}
.rowsub.offers{color:var(--g4);font-family:var(--m);font-size:10px;margin-top:2px}
.unitnote{display:flex;align-items:baseline;gap:6px;margin-top:4px;max-width:290px}
.unitnote .untxt{font-size:11px;color:#7A5C1E;background:var(--gold-lt);border-radius:4px;padding:1px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.unbtn{font-size:10px;padding:1px 6px;border:1px solid var(--g2);border-radius:4px;background:transparent;
  color:var(--g4);cursor:pointer;flex-shrink:0}
.unbtn:hover{border-color:var(--gold);color:var(--gold-dk);background:var(--gold-lt)}
.rowsub.offers .peak{color:var(--gold-dk)}
.delta.up{color:var(--ok)}.delta.dn{color:var(--er)}.delta.flat{color:var(--g4)}

/* ── MODAL ────────────────────────────────────────────── */
.mask{display:none;position:fixed;inset:0;background:rgba(20,36,42,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:var(--white);border-radius:13px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.mhead{padding:16px 20px 12px;border-bottom:1px solid var(--g1)}
.mtitle{font-size:16px;font-weight:700}
.msub{font-size:12px;color:var(--g4);margin-top:3px}
.mbody{padding:16px 20px}
.mfoot{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--g1);flex-wrap:wrap}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--g4);margin-bottom:5px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{
  width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--g2);border-radius:7px;outline:none;background:var(--white);color:var(--teal)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--hdr)}
.fld textarea{resize:vertical;min-height:70px;font-size:13px;line-height:1.5}
.fhint{font-size:11px;color:var(--g4);margin-top:4px;line-height:1.45}
.monthpick{display:flex;flex-wrap:wrap;gap:5px}
.mchip{display:flex;align-items:center;gap:4px;font-size:11.5px;padding:4px 9px;border:1px solid var(--g2);border-radius:20px;cursor:pointer;user-select:none;background:var(--white)}
.mchip.on{background:var(--gold-lt);border-color:var(--gold);color:var(--gold-dk);font-weight:600}
.mchip input{margin:0;width:11px;height:11px}
.ctx{background:var(--teal5);border:1px solid var(--teal1);border-radius:8px;padding:10px 13px;font-size:12.5px;margin-bottom:15px;line-height:1.6}
.ctx b{font-weight:600}
.ctxgrid{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12px;margin-top:6px}
.ctxgrid span:nth-child(odd){color:var(--g4)}
.radio-row{display:flex;flex-direction:column;gap:7px}
.radio-opt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--g2);border-radius:8px;cursor:pointer;transition:all .12s}
.radio-opt:hover{border-color:var(--g3);background:#FAFBFB}
.radio-opt.on{border-color:var(--hdr);background:var(--teal5);box-shadow:0 0 0 1px var(--hdr)}
.radio-opt input{margin-top:2px;flex-shrink:0}
.radio-opt .ro-t{font-size:13px;font-weight:600}
.radio-opt .ro-d{font-size:11.5px;color:var(--g4);margin-top:1px;line-height:1.4}

/* ── EXPOSURE CHART ───────────────────────────────────── */
.chartcard{background:var(--white);border:1px solid var(--g1);border-radius:11px;padding:15px 17px;margin-bottom:14px}
.expwrap{margin-bottom:14px}
.exptoggle{font-size:11.5px;font-weight:600;color:var(--g6);background:var(--white);border:1px solid var(--g1);border-radius:7px;padding:6px 12px;cursor:pointer;margin-bottom:10px}
.exptoggle:hover{border-color:var(--g2);color:var(--teal)}
.charttitle{font-size:13px;font-weight:700;margin-bottom:3px}
.chartsub{font-size:11.5px;color:var(--g4);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:5px;height:132px;padding-bottom:2px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:2px;transition:opacity .13s;cursor:default}
.bar:hover{opacity:.78}
.barn{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g6)}
.barl{font-size:9.5px;color:var(--g4);white-space:nowrap;text-align:center;line-height:1.25}
.barl.pk{color:var(--gold-dk);font-weight:600}
.bar.pk{box-shadow:inset 0 0 0 1px rgba(158,123,47,.35)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px;padding-top:11px;border-top:1px solid var(--g1);font-size:11.5px;color:var(--g4)}
.leg{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px}

/* ── OVERLAYS ─────────────────────────────────────────── */
.load{display:none;position:fixed;inset:0;background:rgba(245,247,247,.8);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:13px}
.load.on{display:flex}
.spin{width:32px;height:32px;border:3px solid var(--g1);border-top-color:var(--hdr);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loadtxt{font-size:12.5px;color:var(--g4)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--hdr);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;z-index:400;opacity:0;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--er)}
.banner{display:flex;gap:11px;align-items:flex-start;padding:11px 15px;border-radius:9px;margin-bottom:14px;font-size:12.5px;line-height:1.5}
.banner.warn{background:var(--wab);border:1px solid var(--wad);color:#7A5C1E}
.banner.err{background:var(--erb);border:1px solid var(--erd);color:#8B2C2C}
.banner b{font-weight:700}
.foot{text-align:center;font-size:10.5px;color:var(--g3);padding:26px 0 10px;line-height:1.6}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────── -->
<div class="auth-wrap login-wrap" id="login-wrap">
  <div class="auth-card">
    <div class="auth-logo">NS</div>
    <div class="auth-title">Renewals</div>
    <div class="auth-sub">NewShire Property Management</div>
    <button class="btn-login" onclick="login()">Sign in with Microsoft</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────── -->
<div class="app-wrap" id="app-wrap">

<div class="topbar">
  <div class="tb-mark">NS</div>
  <div class="tb-name">Renewals</div>
  <div class="tabs" id="tabs"></div>

  <div class="modal" id="modal"></div>
</div>

<div class="load" id="load"><div class="spin"></div><div class="loadtxt" id="load-txt">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  clientId: "b0bfcfc0-5e4f-4b58-a90d-b16f7a9f10d7",
  tenantId: "5e932bcd-838c-4dae-b838-f6d22d7c6b8a",
  siteId:   "newshirepmcom.sharepoint.com,f5d74a99-8b23-477c-aed0-c1682efa5de1,0aa4ab90-0ddc-4a81-a803-06d4f2e1a7d8",
};
const GRAPH  = "https://graph.microsoft.com/v1.0";
const SITE   = `${GRAPH}/sites/${CONFIG.siteId}`;
const SCOPES = ["Sites.ReadWrite.All","User.Read"];

const L_UNITS  = "NS_Renewal_Units";
const L_PIPE   = "NS_Renewal_Pipeline";
const L_CONFIG = "NS_Renewal_Config";
const L_EMP    = "Employees";

/* Policy fallbacks. Overridden per property by NS_Renewal_Config, which itself
   falls back to its own '__default__' row. These constants only apply if the
   config list is missing entirely, so the app still works before provisioning. */
const POLICY = { TargetIncreasePct:3.0, MinIncreasePct:0, MaxIncreasePct:10,
                 OfferWindowDays:75, OwnerSLADays:5, MTMFee:100,
                 ShortTermPremium:50, LongTermDiscount:25 };
/* Months we want leases to expire in. Steering expirations here is the whole
   point of the third offer -- a lease that comes up in peak season re-leases
   faster and for more if the resident does leave. Overridable per property. */
const PEAK_MONTHS_DEFAULT = [5,6,7,8];
/* The two fixed terms; the third is computed per unit. */
const FIXED_TERMS = [9, 12];

/* Stages, in order. Index doubles as sort weight on the board. */
const STAGES = ["Needs Rate","With Owner","Awaiting Approval","Approved to Send","Sent","Non-Renew"];

/* AppFolio renewal statuses that mean this renewal is finished. The old app
   guessed at this by watching the lease end date jump 30+ days; AppFolio has
   been telling us directly all along. */
const AF_DONE = ["Renewed"];
const AF_LEAVING = ["Notice Given"];

/* ══════════════════════════════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════════════════════════════ */
let msalInstance, account;

async function initMSAL(){
  msalInstance = new msal.PublicClientApplication({
    auth:{ clientId:CONFIG.clientId,
           authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`,
           redirectUri:window.location.origin + window.location.pathname },
    cache:{ cacheLocation:"sessionStorage" }
  });
  await msalInstance.initialize();
  const accts = msalInstance.getAllAccounts();
  if(accts.length){ account = accts[0]; await boot(); }
}

async function login(){
  try{
    const r = await msalInstance.loginPopup({scopes:SCOPES});
    account = r.account;
    await boot();
  }catch(e){
    document.getElementById("auth-err").textContent =
      "Sign-in failed: " + (e.errorCode ? e.errorCode+" — " : "") + String(e.message||e).slice(0,200);
  }
}

async function getToken(){
  try{
    return (await msalInstance.acquireTokenSilent({scopes:SCOPES, account})).accessToken;
  }catch{
    return (await msalInstance.acquireTokenPopup({scopes:SCOPES, account})).accessToken;
  }
}

/* ══════════════════════════════════════════════════════════════════
   GRAPH
   ══════════════════════════════════════════════════════════════════ */
async function gFetch(url, opts={}){
  const t = await getToken();
  const r = await fetch(url, {...opts, headers:{
    Authorization:`Bearer ${t}`, "Content-Type":"application/json", ...(opts.headers||{})
  }});
  if(!r.ok){
    const body = await r.text();
    console.error("Graph", r.status, url, body.slice(0,400));
    const e = new Error(`${r.status}: ${body.slice(0,300)}`);
    e.status = r.status;
    throw e;
  }
  return r.status===204 ? null : r.json();
}

/* Reads every page. Following @odata.nextLink is NOT optional: $top caps one
   page at 999, and a client that ignores nextLink silently returns a truncated
   list while reporting success. That bug shipped in another NewShire app and
   cost a day to find -- it looks exactly like "the data is wrong". */
async function listAll(list, filter){
  let url = `${SITE}/lists/${encodeURIComponent(list)}/items?expand=fields&$top=999`;
  if(filter) url += `&$filter=${encodeURIComponent(filter)}`;
  const out = [];
  let guard = 0;
  while(url){
    const d = await gFetch(url);
    out.push(...(d.value||[]));
    url = d["@odata.nextLink"] || null;
    if(++guard > 60) { console.warn("listAll: page guard hit for", list); break; }
  }
  return out;
}

const createItem = (list, fields) =>
  gFetch(`${SITE}/lists/${encodeURIComponent(list)}/items`, {method:"POST", body:JSON.stringify({fields})});

const patchItem = (list, id, fields) =>
  gFetch(`${SITE}/lists/${encodeURIComponent(list)}/items/${id}/fields`, {method:"PATCH", body:JSON.stringify(fields)});

/* ══════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════ */
const S = {
  me:{ name:"", email:"", role:"pm", managerName:"" },
  units:[], pipe:[], config:{}, employees:[],
  renewals:[],                 // merged view model
  ownerStats:{},               // owner -> {total, occupied} across the whole portfolio
  tab:"board",
  scope:"mine",                // 'mine' | 'all'
  filters:{ q:"", stage:"", portfolio:"", property:"", manager:"", urgency:"" },
  collapsed:{},                // ownerName -> true
  syncedAt:null,
  showChart:false,
  busy:false
};

/* ══════════════════════════════════════════════════════════════════
   BOOT / LOAD
   ══════════════════════════════════════════════════════════════════ */
async function boot(){
  document.getElementById("login-wrap").classList.add("hidden");
  document.getElementById("app-wrap").classList.add("on");
  try{ S.tab = sessionStorage.getItem("rn_tab") || "board"; }catch(e){}
  try{ S.scope = sessionStorage.getItem("rn_scope") || "mine"; }catch(e){}
  try{ S.showChart = sessionStorage.getItem("rn_chart") === "1"; }catch(e){}
  await refreshAll();
}

async function refreshAll(){
  showLoad("Loading renewals…");
  try{
    const [units, pipe, cfg, emps] = await Promise.all([
      listAll(L_UNITS),
      listAll(L_PIPE),
      listAll(L_CONFIG).catch(()=>[]),
      listAll(L_EMP).catch(()=>[])
    ]);

    S.units     = units.map(i=>i.fields);
    S.pipe      = pipe.map(i=>({ ...i.fields, spId:i.id }));
    S.employees = emps.map(i=>i.fields);

    S.config = {};
    cfg.forEach(i=>{ const f=i.fields; if(f.Title) S.config[f.Title] = {...f, spId:i.id}; });

    S.syncedAt = S.units.reduce((mx,u)=> (u.SyncedAt && u.SyncedAt>mx) ? u.SyncedAt : mx, "");

    identifyMe();
    buildModel();
    await autoClose();
    hideLoad();
    render();
  }catch(e){
    hideLoad();
    renderFatal(e);
  }
}

/* Who is signed in, and what may they do?
   Role comes from the Employees list. RenewalRole wins; job title is the
   fallback so a new PM works on day one without a data entry step. */
function identifyMe(){
  const email = (account?.username||"").toLowerCase();
  const emp = S.employees.find(e => (e.Email||"").toLowerCase() === email);

  S.me.email = account?.username || "";
  S.me.name  = emp?.Title || emp?.Name || account?.name || S.me.email;

  const role  = (emp?.RenewalRole||"").toLowerCase();
  const title = (emp?.JobTitle||"").toLowerCase();

  if(role.includes("approver") || role.includes("admin") || role.includes("owner")
     || title.includes("operations manager") || title.includes("director") || title.includes("coo")){
    S.me.role = "approver";
  } else {
    S.me.role = "pm";
  }

  /* Units carry ManagerName straight from AppFolio's Site Manager field, so the
     match is on the person's display name. Fall back to matching any manager
     name that appears in the feed, which covers a name recorded slightly
     differently in Employees than in AppFolio. */
  const names = new Set(S.units.map(u=>u.ManagerName).filter(Boolean));
  S.me.managerName = "";
  for(const n of names){
    if(n.toLowerCase() === (S.me.name||"").toLowerCase()){ S.me.managerName = n; break; }
  }
  if(!S.me.managerName){
    const last = (S.me.name||"").split(" ").pop().toLowerCase();
    for(const n of names){
      if(last && n.toLowerCase().endsWith(" "+last)){ S.me.managerName = n; break; }
    }
  }
  /* No property assignment (approver, or a name we couldn't match) -> show
     everything rather than an empty screen. */
  if(!S.me.managerName) S.scope = "all";
}

function policyFor(propertyName){
  const d = S.config["__default__"] || {};
  const p = S.config[propertyName] || {};
  const pick = k => {
    for(const src of [p, d]){
      const v = src[k];
      if(v !== undefined && v !== null && v !== "") return Number(v);
    }
    return POLICY[k];
  };
  const peakRaw = (p.PeakMonths ?? d.PeakMonths ?? "").toString().trim();
  const peak = peakRaw
    ? peakRaw.split(/[^0-9]+/).map(Number).filter(m=>m>=1 && m<=12)
    : PEAK_MONTHS_DEFAULT.slice();
  return {
    TargetIncreasePct: pick("TargetIncreasePct"),
    MinIncreasePct:    pick("MinIncreasePct"),
    MaxIncreasePct:    pick("MaxIncreasePct"),
    OfferWindowDays:   pick("OfferWindowDays"),
    OwnerSLADays:      pick("OwnerSLADays"),
    MTMFee:            pick("MTMFee"),
    ShortTermPremium:  pick("ShortTermPremium"),
    LongTermDiscount:  pick("LongTermDiscount"),
    PeakMonths:        peak.length ? peak : PEAK_MONTHS_DEFAULT.slice()
  };
}

/* ══════════════════════════════════════════════════════════════════
   MODEL — merge feed + pipeline into what the screen actually needs
   ══════════════════════════════════════════════════════════════════ */
function buildModel(){
  const active = {};
  S.pipe.forEach(p=>{
    if(!truthy(p.IsActive)) return;
    const k = String(p.UnitID||"");
    /* Defensive: if two active rows exist for a unit (a double-click during a
       slow save), take the most recently modified and let autoClose() retire
       the other, rather than rendering the unit twice. */
    if(!active[k] || (p.ModifiedOn||"") > (active[k].ModifiedOn||"")) active[k] = p;
  });

  const today = todayStr();

  S.renewals = S.units.map(u=>{
    const uid = String(u.UnitID||"");
    const p   = active[uid] || null;
    const pol = policyFor(u.PropertyName||"");

    const currentRent = num(u.CurrentRent);
    const marketRent  = num(u.MarketRent);
    const leaseEnd    = (u.LeaseEnd||"").slice(0,10);
    const isMTM       = truthy(u.IsMTM);
    /* Vacant units ride along in the feed purely as the occupancy denominator.
       Older feed rows predate the IsOccupied column, so fall back to reading
       the lease status rather than treating them all as occupied. */
    const isOccupied  = ("IsOccupied" in u)
      ? truthy(u.IsOccupied)
      : !(u.LeaseStatus||"").toLowerCase().startsWith("vacant");

    const deadline = leaseEnd ? addDays(leaseEnd, -pol.OfferWindowDays) : "";
    const dtd      = deadline ? daysBetween(today, deadline) : null;
    const dte      = leaseEnd ? daysBetween(today, leaseEnd) : null;

    const afStatus = u.AFRenewalStatus || "";
    const leaving  = AF_LEAVING.includes(afStatus)
                  || (u.LeaseStatus||"").toLowerCase().startsWith("notice")
                  || !!(u.NoticeGivenDate||"");
    const evicting = (u.LeaseStatus||"").toLowerCase().includes("evict");
    const done     = AF_DONE.includes(afStatus);

    const stage = p ? (p.Stage || "Needs Rate") : "Needs Rate";

    /* A renewal is "open work" when AppFolio still has it in the window, nobody
       is leaving, and it is not already finished. Everything else drops off the
       board -- which is exactly what the old app failed to do. */
    const openWork = isOccupied && truthy(u.InRenewalWindow) && !done && !leaving && !evicting;

    /* Owner has been sitting on it past the SLA. */
    const ownerDays = (stage==="With Owner" && p?.OwnerContactedOn)
      ? daysBetween(p.OwnerContactedOn, today) : null;
    const ownerLate = ownerDays !== null && ownerDays > pol.OwnerSLADays;

    const proposed = p && p.ProposedRent!=null && p.ProposedRent!=="" ? num(p.ProposedRent) : null;
    const counter  = p && p.OwnerCounterRent!=null && p.OwnerCounterRent!=="" ? num(p.OwnerCounterRent) : null;
    const final    = p && p.FinalRent!=null && p.FinalRent!=="" ? num(p.FinalRent) : null;
    const suggested = suggestRent(currentRent, marketRent, pol);

    /* Negotiation context -- the case the PM has to make to the owner. */
    const flags = [];
    if(marketRent && currentRent < marketRent*0.95)
      flags.push({cls:"fl-inf", txt:`${money(marketRent-currentRent)} under market`});
    /* The ask exceeding AppFolio's market_rent is worth SEEING, not blocking --
       that field is frequently just a copy of the current rent (see
       suggestRent). Shown so the PM knows to expect the question. */
    else if(marketRent && suggestRent(currentRent, marketRent, pol) > marketRent)
      flags.push({cls:"fl-wa", txt:"ask exceeds AppFolio market"});
    if(num(u.PastDue) > 0)
      flags.push({cls:"fl-er", txt:`${money(num(u.PastDue))} past due`});
    if(num(u.LateCount) >= 2)
      flags.push({cls:"fl-wa", txt:`${num(u.LateCount)}x late`});
    if(num(u.NSFCount) > 0)
      flags.push({cls:"fl-er", txt:`${num(u.NSFCount)} NSF`});
    if(isMTM) flags.push({cls:"fl-wa", txt:"Month-to-month"});

    return {
      uid, u, p, pol, stage,
      property: u.PropertyName||"", unitLabel: u.UnitLabel||u.PropertyName||"",
      owner: u.OwnerName || "— no owner on record —",
      ownerEmail: u.OwnerEmail||"", ownerPhone: u.OwnerPhone||"",
      manager: u.ManagerName||"", portfolio: u.PortfolioType||"",
      resident: u.ResidentName||"", residentPhone: u.ResidentPhone||"",
      currentRent, marketRent, leaseEnd, isMTM, isOccupied,
      deadline, daysToDeadline: dtd, daysToExpiry: dte,
      afStatus, leaving, evicting, done, openWork,
      ownerDays, ownerLate,
      proposed, counter, final, suggested,
      askRent: final ?? counter ?? proposed ?? suggested,
      flags,
      escalated: p ? truthy(p.Escalated) : false,
      mtmOnly: p ? truthy(p.IsMTMOnly) : false,
      unitNote: (p?.Notes || "").trim()
    };
  });

  /* Attach the offer slate. A saved slate wins -- once the PM has priced the
     terms and taken them to the owner, recomputing from policy would silently
     overwrite a negotiated number. */
  S.renewals.forEach(r=>{
    const saved = r.p?.OffersJSON ? safeJSON(r.p.OffersJSON, null) : null;
    r.offers = (Array.isArray(saved) && saved.length)
      ? saved.map(o=>({months:num(o.months), rent:num(o.rent), peak:!!o.peak, mtm:!!o.mtm}))
      : buildOffers(r);
    /* The 12-month term is the headline everything scalar keys off -- approvals,
       metrics, sorting. Fall back to whichever term is nearest 12. */
    r.headline = r.offers.length
      ? (r.offers.find(o=>o.months===12)
         || r.offers.slice().sort((a,b)=>Math.abs(a.months-12)-Math.abs(b.months-12))[0])
      : null;
    if(r.mtmOnly && r.offers.length) r.headline = r.offers[0];

    /* The number on screen and the number the Approve button commits to must be
       the same one. A saved slate is the negotiated truth, so it wins; where
       there is no saved slate but a scalar was stored (FinalRent, the owner's
       counter, or the original proposal), that scalar wins and the headline is
       restated to match it. Either way these two agree afterwards. */
    if(r.headline){
      const hasSavedSlate = Array.isArray(saved) && saved.length > 0;
      if(hasSavedSlate){
        r.askRent = r.headline.rent;
      } else {
        const stored = r.final ?? r.counter ?? r.proposed;
        if(stored != null && r.stage !== "Needs Rate"){
          r.headline = {...r.headline, rent: stored};
          r.offers = r.offers.map(o => o === r.offers.find(x=>x.months===r.headline.months)
            ? {...o, rent: stored} : o);
        }
        r.askRent = r.headline.rent;
      }
    }
  });

  /* Occupancy per owner, over every unit of theirs under management -- not just
     the ones on the board and not limited by the My-properties toggle. It's a
     fact about the owner's portfolio, which is how it gets cited on a call. */
  S.ownerStats = {};
  S.renewals.forEach(r=>{
    const o = (S.ownerStats[r.owner] ||= {total:0, occupied:0});
    o.total++;
    if(r.isOccupied) o.occupied++;
  });

  /* Urgency ordering: overdue first, then nearest deadline, then no-deadline. */
  S.renewals.sort((a,b)=>{
    const av = a.daysToDeadline==null ? 99999 : a.daysToDeadline;
    const bv = b.daysToDeadline==null ? 99999 : b.daysToDeadline;
    return av-bv;
  });
}

/* Target ask, clamped to the property's policy band and rounded to $5 -- the
   number the PM takes into the owner conversation as a starting point.

   NOTE: market rent is deliberately NOT a ceiling here. AppFolio's market_rent
   is a hand-maintained field, not a real comp, and on this portfolio it usually
   just mirrors the current rent -- 128 of 183 open renewals sit at or above it.
   Capping the ask at market therefore proposed a $0 increase on 63% of
   renewals. The policy band (Min/Max %) is the real guardrail; market rent is
   context for the owner conversation, surfaced as a flag on the row. */
/* Standing notes attached to an owner or a property -- the thing the old app
   showed as a banner over the review table, carried over by
   scripts/migrate-notes.ps1. Owner notes ride on every one of their units;
   property notes only on that property's. */
function standingNote(key){
  const c = S.config[key];
  const t = (c?.StandingNotes || "").trim();
  return t || "";
}

/* ── OFFER SLATE ──────────────────────────────────────────────
   Residents get up to three terms to choose from: 9 months, 12 months, and a
   term sized so the NEXT expiration lands in peak leasing season. That third
   one is the lever that pulls a badly-timed lease (expiring in December, when
   nobody moves) onto a good month over one cycle, instead of it renewing into
   the same dead month every year forever. */

/* Months to add to `from` so the lease ends inside a peak month.
   Returns null when 9 or 12 already lands in peak, or nothing sensible fits --
   in that case there is no third offer and the resident sees two. */
function peakTerm(leaseEnd, pol){
  const start = parseD(leaseEnd);
  if(!start || !pol.PeakMonths?.length) return null;
  const peak = new Set(pol.PeakMonths);

  // If a fixed term already lands in peak, a third option adds nothing.
  for(const t of FIXED_TERMS){
    if(peak.has(monthAfter(start, t))) return null;
  }
  // Otherwise take the candidate closest to 12 months -- long enough to be
  // worth writing, short enough that the owner will wear it.
  let best = null;
  for(let t = 6; t <= 24; t++){
    /* Keep at least two months' daylight from the fixed terms -- an 8-month
       sitting next to a 9-month is not a choice, it's noise. */
    if(FIXED_TERMS.some(f => Math.abs(t - f) < 2)) continue;
    if(!peak.has(monthAfter(start, t))) continue;
    if(best === null || Math.abs(t-12) < Math.abs(best-12)) best = t;
  }
  return best;
}

/* Calendar month (1-12) that lands `n` months after date `d`. */
function monthAfter(d, n){
  return ((d.getMonth() + n) % 12) + 1;
}

/* The full slate for a unit, cheapest-term-first ordering left to the caller.
   Shorter than 12 costs more, longer earns a discount -- the resident is
   buying certainty either way. */
function buildOffers(r){
  const base = r.suggested;
  if(!base) return [];
  /* MTM-only: no fixed term is offered at all. One month-to-month rate, priced
     at the current rent plus the property's MTM fee -- the premium for the
     resident keeping the flexibility to leave on 30 days' notice. */
  if(r.mtmOnly){
    return [{months:0, rent: Math.round((r.currentRent + num(r.pol.MTMFee))/5)*5, mtm:true}];
  }
  const price = t => {
    /* Scaled by distance from the 12-month standard: ShortTermPremium is quoted
       as the 9-month figure (3 months short) and LongTermDiscount as the
       18-month one (6 months long). A flat adjustment priced a 7- and a
       9-month term identically, which makes the shorter one pointless. */
    const adj = t < 12 ?  num(r.pol.ShortTermPremium) * (12 - t) / 3
              : t > 12 ? -num(r.pol.LongTermDiscount) * (t - 12) / 6
              : 0;
    return Math.max(0, Math.round((base + adj)/5)*5);
  };
  const terms = [...FIXED_TERMS];
  const pk = r.isMTM ? null : peakTerm(r.leaseEnd, r.pol);
  if(pk) terms.push(pk);
  terms.sort((a,b)=>a-b);
  return terms.map(t=>({months:t, rent:price(t), peak: t===pk}));
}

function suggestRent(current, market, pol){
  if(!current) return 0;
  const min = current * (1 + pol.MinIncreasePct/100);
  const max = current * (1 + pol.MaxIncreasePct/100);
  let r = current * (1 + pol.TargetIncreasePct/100);
  r = Math.min(Math.max(r, min), max);
  return Math.round(r/5)*5;
}

/* ── Auto-close: retire pipeline rows AppFolio says are finished ──
   This is the behaviour that was missing. Once AppFolio reports the lease
   Renewed (or the resident gave notice, or the lease end moved past what we
   opened the row against), the row closes itself and stops occupying the
   board. No user action, no stale queue. */
async function autoClose(){
  const byUid = {};
  S.units.forEach(u=> byUid[String(u.UnitID||"")] = u);

  const closes = [];
  S.pipe.filter(p=>truthy(p.IsActive)).forEach(p=>{
    const uid = String(p.UnitID||"");
    const u = byUid[uid];
    let reason = "";

    if(!u){
      /* The unit left the feed entirely -- moved out, or off management. */
      reason = "Unit no longer in AppFolio feed";
    } else if(AF_DONE.includes(u.AFRenewalStatus||"")){
      reason = "AppFolio reports the lease Renewed";
    } else if(AF_LEAVING.includes(u.AFRenewalStatus||"") || (u.NoticeGivenDate||"")){
      reason = "Resident gave notice";
    } else {
      const snap = (p.LeaseEndSnapshot||"").slice(0,10);
      const now  = (u.LeaseEnd||"").slice(0,10);
      if(snap && now && now > snap) reason = "Lease end moved forward — renewed outside the app";
    }
    if(reason) closes.push({p, reason});
  });

  if(!closes.length) return;

  showLoad(`Closing ${closes.length} completed renewal${closes.length>1?"s":""}…`);
  let ok = 0;
  for(const c of closes){
    try{
      await patchItem(L_PIPE, c.p.spId, {
        IsActive:false, ClosedOn:todayStr(), ClosedReason:c.reason,
        ModifiedBy2:S.me.name, ModifiedOn:new Date().toISOString()
      });
      c.p.IsActive = false; c.p.ClosedOn = todayStr(); c.p.ClosedReason = c.reason;
      ok++;
    }catch(e){ console.warn("autoClose failed for", c.p.UnitID, e.message); }
  }
  if(ok) buildModel();
  hideLoad();
  if(ok) toast(`${ok} completed renewal${ok>1?"s":""} cleared off the board.`);
}

/* ══════════════════════════════════════════════════════════════════
   SELECTORS
   ══════════════════════════════════════════════════════════════════ */
function inScope(r){
  if(S.scope==="all") return true;
  return !!S.me.managerName && r.manager === S.me.managerName;
}
function matchFilters(r){
  const f = S.filters;
  if(f.stage && r.stage !== f.stage) return false;
  if(f.portfolio && r.portfolio !== f.portfolio) return false;
  if(f.property && r.property !== f.property) return false;
  if(f.manager && r.manager !== f.manager) return false;
  if(f.urgency){
    const d = r.daysToDeadline;
    /* A renewal with no lease end date has no deadline to be late against, so
       it is neither overdue nor due-soon -- it must not sit in either bucket
       pretending to be urgent. */
    if(d === null) return false;
    if(f.urgency === "overdue" && d >= 0) return false;
    if(f.urgency === "soon"    && (d < 0 || d > 14)) return false;
    if(f.urgency === "late"    && d > 14) return false;
  }
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = `${r.unitLabel} ${r.resident} ${r.property} ${r.owner}`.toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
const boardRows    = () => S.renewals.filter(r=>r.openWork && r.stage!=="Sent" && inScope(r) && matchFilters(r));
const approvalRows = () => S.renewals.filter(r=>r.openWork && r.stage==="Awaiting Approval");
const escalatedRows= () => S.renewals.filter(r=>r.openWork && r.stage==="With Owner" && r.ownerLate);
const sentRows     = () => S.renewals.filter(r=>r.stage==="Sent" && !r.done && inScope(r));
const myOpenCount  = () => S.renewals.filter(r=>r.openWork && r.stage!=="Sent" && inScope(r)).length;

/* ══════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════ */
function render(){
  /* Filtering re-renders the whole pane, which destroys the input the user is
     typing into. Without this the search box loses focus after the first
     keystroke and the app feels broken. Capture where the caret was, restore it
     after the rebuild. */
  const act = document.activeElement;
  const keep = (act && act.id && (act.tagName==="INPUT"||act.tagName==="TEXTAREA"))
    ? {id:act.id, start:act.selectionStart, end:act.selectionEnd} : null;

  _mcHandlers = {};
  renderTabs();
  renderWho();
  renderStale();
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  document.getElementById("pane-"+S.tab)?.classList.add("on");
  ({ board:renderBoard, approvals:renderApprovals, sent:renderSent,
     portfolio:renderPortfolio, settings:renderSettings }[S.tab] || renderBoard)();

  if(keep){
    const el = document.getElementById(keep.id);
    if(el){
      el.focus();
      try{ el.setSelectionRange(keep.start, keep.end); }
      catch(e){ /* number inputs reject setSelectionRange; focus alone is enough */ }
    }
  }
}

function showTab(t){
  S.tab = t;
  try{ sessionStorage.setItem("rn_tab", t); }catch(e){}
  render();
  window.scrollTo(0,0);
}

function renderTabs(){
  const appr = approvalRows().length, esc = escalatedRows().length;
  const defs = [
    {id:"board",     label:"My Board",  count:myOpenCount()},
    {id:"approvals", label:"Approvals", count:appr+esc, urgent:esc>0},
    {id:"sent",      label:"Sent",      count:sentRows().length},
    {id:"portfolio", label:"Portfolio"},
    {id:"settings",  label:"Settings"}
  ];
  document.getElementById("tabs").innerHTML = defs.map(d=>`
    <div class="tab ${S.tab===d.id?"on":""}" onclick="showTab('${d.id}')">
      ${esc_(d.label)}
      ${d.count ? `<span class="tab-ct ${d.urgent?"urgent":""}">${d.count}</span>` : ""}
    </div>`).join("");
}

function renderWho(){
  const roleLbl = S.me.role==="approver" ? "Approver" : "Property Manager";
  document.getElementById("tb-who").innerHTML =
    `<b>${esc_(S.me.name)}</b>${esc_(roleLbl)}${S.me.managerName?"":" · all properties"}`;
}

function renderStale(){
  const el = document.getElementById("stale-banner");
  if(!S.syncedAt){ el.innerHTML=""; return; }
  const age = daysBetween(S.syncedAt.slice(0,10), todayStr());
  if(age <= 1){ el.innerHTML=""; return; }
  el.innerHTML = `<div class="banner warn"><div>⚠</div><div>
    <b>AppFolio data is ${age} days old.</b> The nightly feed last ran ${fmtDate(S.syncedAt.slice(0,10))}.
    Rents, lease dates and renewal statuses below may be out of date —
    check the <i>Daily AppFolio ETL</i> GitHub Action for a failed run.</div></div>`;
}

function renderFatal(e){
  const missing = String(e.message||"").includes("404") || e.status===404;
  document.getElementById("pane-board").classList.add("on");
  document.getElementById("pane-board").innerHTML = `
    <div class="banner err"><div>✕</div><div>
      <b>Could not load renewal data.</b><br>${esc_(String(e.message||e).slice(0,300))}
      ${missing ? `<br><br>The SharePoint lists may not exist yet. Run
        <code>scripts/provision-renewal-lists.ps1</code>, then run the
        <i>Daily AppFolio ETL</i> workflow once to populate them.` : ""}
    </div></div>`;
}

/* ── FILTER BAR (shared) ───────────────────────────────── */
function filterBar(opts={}){
  const props = [...new Set(S.renewals.filter(inScope)
    .filter(r=>!S.filters.manager || r.manager===S.filters.manager)
    .map(r=>r.property))].sort();
  const scopeSeg = S.me.managerName ? `
    <div class="seg">
      <button class="${S.scope==="mine"?"on":""}" onclick="setScope('mine')">My properties</button>
      <button class="${S.scope==="all"?"on":""}" onclick="setScope('all')">All</button>
    </div>` : "";
  return `<div class="fbar">
    ${scopeSeg}
    <input class="finp search" id="f-search" placeholder="Search unit, resident, owner…"
           value="${esc_(S.filters.q)}" oninput="setFilter('q',this.value)">
    ${opts.stage!==false ? `<select class="fsel" onchange="setFilter('stage',this.value)">
      <option value="">All stages</option>
      ${STAGES.map(s=>`<option ${S.filters.stage===s?"selected":""}>${s}</option>`).join("")}
    </select>` : ""}
    <select class="fsel" onchange="setFilter('portfolio',this.value)">
      <option value="">Both portfolios</option>
      <option ${S.filters.portfolio==="Multi-Family"?"selected":""}>Multi-Family</option>
      <option ${S.filters.portfolio==="Single-Family"?"selected":""}>Single-Family</option>
    </select>
    <select class="fsel urgsel" onchange="setFilter('urgency',this.value)" title="How close the send deadline is">
      <option value="">Any deadline</option>
      <option value="overdue" ${S.filters.urgency==="overdue"?"selected":""}>Past deadline — send now</option>
      <option value="soon" ${S.filters.urgency==="soon"?"selected":""}>Due within 14 days</option>
      <option value="late" ${S.filters.urgency==="late"?"selected":""}>Overdue or due within 14 days</option>
    </select>
    <select class="fsel" onchange="setManagerFilter(this.value)" title="Property manager, from AppFolio's Site Manager field">
      <option value="">All PMs</option>
      ${[...new Set(S.renewals.map(r=>r.manager).filter(Boolean))].sort()
        .map(m=>`<option ${S.filters.manager===m?"selected":""}>${esc_(m)}</option>`).join("")}
    </select>
    <select class="fsel" onchange="setFilter('property',this.value)">
      <option value="">All properties</option>
      ${props.map(p=>`<option ${S.filters.property===p?"selected":""}>${esc_(p)}</option>`).join("")}
    </select>
    ${opts.right||""}
  </div>`;
}
function setFilter(k,v){ S.filters[k]=v; render(); }

/* Choosing a PM only makes sense across the whole portfolio -- leaving the
   My-properties scope on would guarantee an empty board for anyone but you. */
function setManagerFilter(v){
  S.filters.manager = v;
  S.filters.property = "";          // the old property may not be theirs
  if(v) S.scope = "all";
  try{ sessionStorage.setItem("rn_scope", S.scope); }catch(e){}
  render();
}
function setScope(v){ S.scope=v; try{sessionStorage.setItem("rn_scope",v);}catch(e){} render(); }

/* ── BOARD ─────────────────────────────────────────────── */
function renderBoard(){
  const rows = boardRows();
  const all  = S.renewals.filter(r=>r.openWork && r.stage!=="Sent" && inScope(r));

  const byStage = s => all.filter(r=>r.stage===s).length;
  const overdue = all.filter(r=>r.daysToDeadline!=null && r.daysToDeadline<0).length;

  const metrics = `<div class="mrow">
    ${mc("Open renewals", all.length, "", "", !S.filters.stage, ()=>setFilter("stage",""))}
    ${mc("Need a rate", byStage("Needs Rate"), "b", "you set the ask", S.filters.stage==="Needs Rate", ()=>setFilter("stage","Needs Rate"))}
    ${mc("With owner", byStage("With Owner"), "w", "awaiting their answer", S.filters.stage==="With Owner", ()=>setFilter("stage","With Owner"))}
    ${mc("Awaiting approval", byStage("Awaiting Approval"), "", "on Brandy's desk", S.filters.stage==="Awaiting Approval", ()=>setFilter("stage","Awaiting Approval"))}
    ${mc("Ready to send", byStage("Approved to Send"), "g", "send in AppFolio", S.filters.stage==="Approved to Send", ()=>setFilter("stage","Approved to Send"))}
    ${overdue ? mc("Past deadline", overdue, "r", "send window missed",
                   S.filters.urgency==="overdue",
                   ()=>setFilter("urgency", S.filters.urgency==="overdue" ? "" : "overdue")) : ""}
  </div>`;

  /* Grouped by owner: the PM's real unit of work is one conversation covering
     every unit that owner has expiring, even though each unit resolves on its
     own terms. */
  const groups = {};
  rows.forEach(r=>{ (groups[r.owner] ||= []).push(r); });
  const owners = Object.keys(groups).sort((a,b)=>{
    const ua = Math.min(...groups[a].map(r=>r.daysToDeadline ?? 99999));
    const ub = Math.min(...groups[b].map(r=>r.daysToDeadline ?? 99999));
    return ua-ub;
  });

  document.getElementById("pane-board").innerHTML = `
    <div class="phead">
      <div>
        <div class="ptitle">My Board</div>
        <div class="psub">Every renewal is negotiated with the owner before the offer goes to the resident.
          Set the ask, take it to the owner, log what they said — then it routes for approval.</div>
      </div>
      <div class="pstamp">${S.syncedAt ? "AppFolio synced "+fmtDateTime(S.syncedAt) : ""}</div>
    </div>
    ${metrics}
    ${filterBar()}
    <div class="expwrap">
      <button class="exptoggle" onclick="toggleExposure()">
        ${S.showChart ? "▾" : "▸"} Exposure — next 18 months
      </button>
      ${S.showChart ? exposureChart(S.renewals.filter(inScope).filter(r=>r.isOccupied),
                                    "Lease expirations — next 18 months") : ""}
    </div>
    ${owners.length ? owners.map(o=>ownerCard(o, groups[o])).join("") : emptyBoard(all.length)}
  `;
}

function emptyBoard(totalOpen){
  if(totalOpen===0) return `<div class="tw"><div class="tempty">
    <span class="big">✓</span><b>Nothing open.</b><br>
    Every renewal in your window has been handled. New ones appear here as AppFolio
    opens them, ${S.scope==="mine"?"for the properties assigned to you":"across all properties"}.
  </div></div>`;
  return `<div class="tw"><div class="tempty">
    <span class="big">🔍</span>No renewals match these filters.<br>
    <button class="btn sm" style="margin-top:10px" onclick="clearFilters()">Clear filters</button>
  </div></div>`;
}
function toggleExposure(){
  S.showChart = !S.showChart;
  try{ sessionStorage.setItem("rn_chart", S.showChart ? "1" : "0"); }catch(e){}
  render();
}

function clearFilters(){ S.filters={q:"",stage:"",portfolio:"",property:"",manager:"",urgency:""}; render(); }

function ownerCard(owner, rows){
  const collapsed = !!S.collapsed[owner];
  const esc = rows.some(r=>r.ownerLate);
  const r0 = rows[0];
  const soonest = Math.min(...rows.map(r=>r.daysToDeadline ?? 99999));
  const needsAction = rows.filter(r=>r.stage==="Needs Rate").length;
  const withOwner   = rows.filter(r=>r.stage==="With Owner").length;

  const curTotal = rows.reduce((s,r)=>s+r.currentRent,0);
  const askTotal = rows.reduce((s,r)=>s+(r.askRent||r.currentRent),0);
  const lift = curTotal ? ((askTotal-curTotal)/curTotal*100) : 0;

  const emails = (r0.ownerEmail||"").split(",").map(s=>s.trim()).filter(Boolean);

  return `<div class="ocard ${collapsed?"collapsed":""} ${esc?"esc":""}">
    <div class="ohead" onclick="toggleOwner('${jsq(owner)}')">
      <div class="ocaret">▼</div>
      <div>
        <div class="oname">${esc_(owner)}</div>
        <div class="ometa">
          <span>${rows.length} unit${rows.length>1?"s":""}</span>
          ${emails.length ? `<a href="mailto:${esc_(emails[0])}" onclick="event.stopPropagation()">${esc_(emails[0])}</a>` : `<span style="color:var(--g3)">no email on file</span>`}
          ${r0.ownerPhone ? `<span>${esc_(r0.ownerPhone)}</span>` : ""}
        </div>
      </div>
      <div class="oright" onclick="event.stopPropagation()">
        ${occBadge(owner)}
        ${esc ? `<span class="bdg b-er">Owner overdue</span>` : ""}
        ${needsAction ? `<span class="bdg b-inf">${needsAction} need a rate</span>` : ""}
        ${withOwner ? `<span class="bdg b-wa">${withOwner} with owner</span>` : ""}
        <span class="bdg ${soonest<0?"b-er":soonest<14?"b-wa":"b-gr"}">${deadlineLabel(soonest)}</span>
        <span class="bdg b-gr">${money(curTotal)} → ${money(askTotal)} (${lift>=0?"+":""}${lift.toFixed(1)}%)</span>
        ${emails.length ? `<button class="ocopy" onclick="copyOwnerBrief('${jsq(owner)}')">⧉ Copy owner brief</button>` : ""}
      </div>
    </div>
    <div class="obody">${ownerNotesBlock(owner, rows)}<div class="tscr"><table>
      <thead><tr>
        <th>Unit / Resident</th>
        <th>Lease ends</th>
        <th>Send by</th>
        <th class="num">Current</th>
        <th class="num">Market</th>
        <th class="num">Ask</th>
        <th>Stage</th>
        <th>Next step</th>
      </tr></thead>
      <tbody>${rows.map(unitRow).join("")}</tbody>
    </table></div></div>
  </div>`;
}
function toggleOwner(o){ S.collapsed[o] = !S.collapsed[o]; render(); }

/* Owner-level note plus a note for any property represented in this card. */
function ownerNotesBlock(owner, rows){
  const items = [];
  const on = standingNote(owner);
  if(on) items.push({label:"Owner", text:on});
  [...new Set(rows.map(r=>r.property))].sort().forEach(prop=>{
    const pn = standingNote(prop);
    if(pn) items.push({label:prop, text:pn});
  });
  const edit = `<button class="notebtn" title="Edit the standing note for this owner"
                  onclick="event.stopPropagation();openNoteEditor('${jsq(owner)}','Owner')">
                  ${on?"Edit note":"+ Add note"}</button>`;
  if(!items.length){
    return `<div class="noterow empty">${edit}</div>`;
  }
  return `<div class="noterow">
    <div class="notes">${items.map(i=>
      `<div class="note"><span class="notelbl">${esc_(i.label)}</span><span class="notetxt">${esc_(i.text)}</span></div>`
    ).join("")}</div>${edit}</div>`;
}

function openNoteEditor(key, scope){
  const cur = standingNote(key);
  openModal({
    title:`Standing note — ${key}`,
    sub: scope==="Owner"
      ? "Shows on every renewal for this owner."
      : "Shows on every renewal at this property.",
    body:`<div class="fld">
        <label>Note</label>
        <textarea id="m-note" placeholder="Anything the team should know before working a renewal here…">${esc_(cur)}</textarea>
        <div class="fhint">Kept on NS_Renewal_Config. Carried over from the old app's
          property notes by scripts/migrate-notes.ps1.</div>
      </div>`,
    actions:`<button class="btn" onclick="closeModal()">Cancel</button>
             <button class="btn pri" onclick="saveNote('${jsq(key)}','${jsq(scope)}')">Save note</button>`
  });
}

async function saveNote(key, scope){
  const text = document.getElementById("m-note").value || "";
  closeModal();
  await withBusy("Saving note…", async ()=>{
    const existing = S.config[key];
    if(existing?.spId) await patchItem(L_CONFIG, existing.spId, {StandingNotes:text, Scope:scope});
    else                await createItem(L_CONFIG, {Title:key, StandingNotes:text, Scope:scope});
    const cfg = await listAll(L_CONFIG);
    S.config = {};
    cfg.forEach(i=>{ const f=i.fields; if(f.Title) S.config[f.Title] = {...f, spId:i.id}; });
    buildModel(); render();
    toast(text.trim() ? "Note saved." : "Note cleared.");
  });
}

/* Occupancy across everything this owner has under management. Deliberately not
   filtered by the My-properties toggle or by the board's filters -- it's the
   number you'd quote on the call, so it must not move when the view changes.
   90%+ reads as healthy, 80-90% watch, below 80% is a real problem. */
function occBadge(owner){
  const st = S.ownerStats[owner];
  if(!st || !st.total) return "";
  const pct = st.occupied / st.total * 100;
  const cls = pct >= 90 ? "b-ok" : pct >= 80 ? "b-wa" : "b-er";
  const vacant = st.total - st.occupied;
  const title = `${st.occupied} of ${st.total} units occupied`
    + (vacant ? ` · ${vacant} vacant` : "")
    + " · whole portfolio, not just the units shown";
  return `<span class="bdg ${cls}" title="${esc_(title)}">${pct.toFixed(0)}% occupied`
       + `<span style="font-weight:400;opacity:.75;margin-left:4px">${st.occupied}/${st.total}</span></span>`;
}

function unitRow(r){
  const dtd = r.daysToDeadline;
  return `<tr>
    <td>
      <b>${esc_(r.unitLabel)}</b>
      <span class="rowsub">${esc_(r.resident||"—")}</span>
      ${r.flags.length ? `<div style="margin-top:4px">${r.flags.map(f=>`<span class="flag ${f.cls}">${esc_(f.txt)}</span>`).join("")}</div>` : ""}
      ${unitNoteCell(r)}
    </td>
    <td>${r.isMTM ? `<span class="bdg b-wa">MTM</span>` : fmtDate(r.leaseEnd)}
      ${r.daysToExpiry!=null && !r.isMTM ? `<span class="rowsub">${r.daysToExpiry} days</span>` : ""}</td>
    <td>${r.deadline ? `<span class="bdg ${dtd<0?"b-er":dtd<14?"b-wa":"b-gr"}">${deadlineLabel(dtd)}</span>` : "—"}</td>
    <td class="num">${money(r.currentRent)}</td>
    <td class="num" style="color:var(--g4)">${r.marketRent?money(r.marketRent):"—"}</td>
    <td class="num">${askCell(r)}</td>
    <td>${stageBadge(r)}</td>
    <td>${nextStep(r)}</td>
  </tr>`;
}

/* A note the PM writes about THIS unit. It is what goes into the owner brief --
   the brief used to auto-fill its Notes line from the risk flags, which meant
   every owner email said the same generic things and nothing the PM actually
   knew about the unit. */
function unitNoteCell(r){
  return `<div class="unitnote">
    ${r.unitNote ? `<span class="untxt" title="${esc_(r.unitNote)}">${esc_(r.unitNote)}</span>` : ""}
    <button class="unbtn" title="${r.unitNote?"Edit this unit's note":"Add a note for this unit"}"
            onclick="event.stopPropagation();openUnitNote('${jsq(r.uid)}')">${r.unitNote?"edit":"+ note"}</button>
  </div>`;
}

function openUnitNote(uid){
  const r = byUid(uid); if(!r) return;
  openModal({
    title:"Unit note",
    sub:`${r.property} · ${r.unitLabel} · ${r.resident||"vacant"}`,
    body:`<div class="fld">
        <label>What should the owner know about this unit?</label>
        <textarea id="m-unote" placeholder="Condition, history with the resident, anything that shapes the rate…">${esc_(r.unitNote)}</textarea>
        <div class="fhint">This is the line that appears under this unit in the owner brief.
          Leave it blank and the unit simply has no note.</div>
      </div>`,
    actions:`<button class="btn" onclick="closeModal()">Cancel</button>
             <button class="btn pri" onclick="saveUnitNote('${jsq(uid)}')">Save note</button>`
  });
}

async function saveUnitNote(uid){
  const r = byUid(uid); if(!r) return;
  const text = (document.getElementById("m-unote").value || "").trim();
  closeModal();
  await withBusy("Saving note…", async ()=>{
    await savePipe(r, {Notes: text});
    await reload();
    toast(text ? "Note saved." : "Note cleared.");
  });
}

function askCell(r){
  const o = r.headline;
  if(!o && !r.askRent) return "—";
  const head = o ? o.rent : r.askRent;
  /* Compare by term, not object identity: the headline may be a restated copy
     of an offer rather than the same object, which would list it twice. */
  const others = r.offers.filter(x=>x.months !== o.months);
  return `<b>${money(head)}</b>`
    + `<span class="rowsub">${o?termLabel(o)+" · ":""}${deltaLabel(r.currentRent, head)}</span>`
    + (others.length
        ? `<span class="rowsub offers">${others.map(x=>
            `${termLabel(x,true)} ${money(x.rent)}${x.peak?' <span class="peak" title="Ends in peak leasing season">★</span>':''}`
          ).join(" · ")}</span>`
        : "");
}

/* months === 0 means month-to-month, not a zero-month lease. */
function termLabel(o, short=false){
  if(!o) return "";
  if(o.months === 0 || o.mtm) return short ? "MTM" : "Month-to-month";
  return short ? `${o.months}mo` : `${o.months} mo`;
}

function deltaLabel(from,to){
  if(!from || !to) return "";
  const d = to-from, pct = d/from*100;
  const cls = d>0?"up":d<0?"dn":"flat";
  return `<span class="delta ${cls}">${d>0?"+":""}${money(d)} (${d>0?"+":""}${pct.toFixed(1)}%)</span>`;
}

function stageBadge(r){
  const map = {
    "Needs Rate":       ["b-inf","Needs rate"],
    "With Owner":       [r.ownerLate?"b-er":"b-wa", r.ownerLate?`Owner ${r.ownerDays}d`:"With owner"],
    "Awaiting Approval":["b-gold","Awaiting approval"],
    "Approved to Send": ["b-ok","Ready to send"],
    "Sent":             ["b-gr","Sent"],
    "Non-Renew":        ["b-er","Non-renew"]
  };
  const [cls,txt] = map[r.stage] || ["b-gr", r.stage];
  return `<span class="bdg ${cls}">${esc_(txt)}</span>`
       + (r.mtmOnly ? ` <span class="bdg b-gold" title="Offered month-to-month only — no fixed term">MTM only</span>` : "")
       /* A rate that skipped the owner must never be indistinguishable from one
          the owner actually signed off on. */
       + (r.p?.OwnerOutcome === "Bypassed"
            ? ` <span class="bdg b-er" title="Approved without the owner signing off">owner skipped</span>` : "");
}

/* The single most important column: what does this person do next? */
function nextStep(r){
  const canApprove = S.me.role==="approver";
  switch(r.stage){
    case "Needs Rate":
      return `<div class="btnrow">
        <button class="btn pri sm" onclick="openTakeToOwner('${jsq(r.uid)}')">Take to owner →</button>
        ${canApprove ? `<button class="btn sm ovr" title="Approve without the owner step"
            onclick="openOverride('${jsq(r.uid)}')">Skip owner</button>` : ""}
        <button class="btn sm dgr" onclick="openNonRenew('${jsq(r.uid)}')">Non-renew</button>
      </div>`;
    case "With Owner":
      return `<div class="btnrow">
        <button class="btn pri sm" onclick="openOwnerReply('${jsq(r.uid)}')">Log owner's reply</button>
        ${r.ownerLate && !r.escalated ? `<button class="btn sm" onclick="escalate('${jsq(r.uid)}')">Escalate</button>` : ""}
        ${canApprove ? `<button class="btn sm ovr" title="Approve without waiting for the owner"
            onclick="openOverride('${jsq(r.uid)}')">Override</button>` : ""}
        ${r.escalated ? `<span class="bdg b-er">Escalated</span>` : ""}
      </div>`;
    case "Awaiting Approval":
      return canApprove
        ? `<div class="btnrow">
             <button class="btn ok sm" onclick="approve('${jsq(r.uid)}')">Approve ${money(r.askRent)}</button>
             <button class="btn sm" onclick="openSendBack('${jsq(r.uid)}')">Send back</button>
           </div>`
        : `<span style="font-size:11.5px;color:var(--g4)">Waiting on approval</span>`;
    case "Approved to Send":
      return `<button class="btn ok sm" onclick="markSent('${jsq(r.uid)}')">Mark sent in AppFolio</button>`;
    case "Sent":
      return `<span style="font-size:11.5px;color:var(--g4)">Sent ${fmtDate(r.p?.SentOn)}</span>`;
    case "Non-Renew":
      return `<div class="btnrow"><span style="font-size:11.5px;color:var(--g4)">${esc_(r.p?.NonRenewReason||"Not renewing")}</span>
        <button class="btn sm" onclick="reopen('${jsq(r.uid)}')">Reopen</button></div>`;
  }
  return "";
}

/* ── EXPOSURE CHART ────────────────────────────────────────────
   18 months forward, because a renewal written today can push an expiration up
   to 18 months out -- a 12-month window hid exactly the months the peak-season
   term is steering leases INTO, which made the third offer impossible to judge.
   Peak months are marked so you can see whether expirations land where you
   want them. */
function mtmCount(rows){ return rows.filter(r=>r.isMTM || !r.leaseEnd).length; }

function exposureChart(rows, title){
  const MONTHS = 18;
  const pol = policyFor(S.filters.property || "");
  const peak = new Set(pol.PeakMonths || []);

  const buckets = [];
  const now = new Date();
  for(let i=0;i<MONTHS;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    buckets.push({ key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,
                   m:d.getMonth()+1, y:d.getFullYear(), n:0 });
  }
  const idx = {}; buckets.forEach((b,i)=>idx[b.key]=i);

  let mtm = 0, beyond = 0;
  rows.forEach(r=>{
    if(r.isMTM || !r.leaseEnd){ mtm++; return; }
    const i = idx[r.leaseEnd.slice(0,7)];
    if(i===undefined){ beyond++; return; }
    buckets[i].n++;
  });

  const dated = rows.length - mtm;
  const avg = dated ? dated/MONTHS : 0;
  const max = Math.max(1, ...buckets.map(b=>b.n));

  const bars = buckets.map(b=>{
    const isPeak = peak.has(b.m);
    const heavy  = avg && b.n > avg*1.5;
    const colour = heavy ? "var(--er)" : isPeak ? "var(--gold)" : "var(--inf)";
    const t = `${MONTH_ABBR[b.m-1]} ${b.y}: ${b.n} lease${b.n===1?"":"s"} expiring`
            + (isPeak ? " · peak leasing season" : "")
            + (heavy ? " · heavy month" : "");
    return `<div class="barcol">
      <div class="barn">${b.n||""}</div>
      <div class="bar${isPeak?" pk":""}" style="height:${Math.max(2, b.n/max*96)}px;background:${colour}"
           title="${esc_(t)}"></div>
      <div class="barl${isPeak?" pk":""}">${MONTH_ABBR[b.m-1]}${b.m===1?"<br>"+String(b.y).slice(2):""}</div>
    </div>`;
  }).join("");

  return `<div class="chartcard">
    <div class="charttitle">${esc_(title)}</div>
    <div class="chartsub">
      ${dated} dated lease${dated===1?"":"s"} · ${mtm} month-to-month
      ${beyond?` · ${beyond} beyond 18 months`:""}
      · peak season ${monthNames(pol.PeakMonths)}
    </div>
    <div class="bars">${bars}</div>
    <div class="legend">
      <div class="leg"><div class="dot" style="background:var(--gold)"></div>Peak leasing season — where you want expirations</div>
      <div class="leg"><div class="dot" style="background:var(--inf)"></div>Off-peak</div>
      <div class="leg"><div class="dot" style="background:var(--er)"></div>Heavy — 50%+ above average</div>
    </div>
  </div>`;
}

async function saveConfig(title){
  const vals = {};
  ["TargetIncreasePct","MinIncreasePct","MaxIncreasePct","OfferWindowDays","OwnerSLADays",
   "MTMFee","ShortTermPremium","LongTermDiscount"]
    .forEach(k=>{ const el = document.getElementById("cfg-"+k); if(el) vals[k]=Number(el.value)||0; });
  const peaks = [...document.querySelectorAll(".cfg-peak:checked")].map(el=>el.value);
  if(document.querySelector(".cfg-peak")) vals.PeakMonths = peaks.join(",");
  vals.Scope = title === "__default__" ? "Default" : "Property";
  await withBusy("Saving policy…", async ()=>{
    const existing = S.config[title];
    if(existing?.spId) await patchItem(L_CONFIG, existing.spId, vals);
    else await createItem(L_CONFIG, {Title:title, ...vals});
    await refreshAll();
    toast("Policy saved.");
  });
}

/* ══════════════════════════════════════════════════════════════════
   ACTIONS — the workflow
   PM sets a rate → takes it to the owner → logs the owner's answer →
   it routes for approval → approved → PM sends it in AppFolio.
   ══════════════════════════════════════════════════════════════════ */

function byUid(uid){ return S.renewals.find(r=>r.uid===uid); }

/* Create-or-update the pipeline row for a unit. */
async function savePipe(r, fields){
  const base = {
    UnitID:r.uid, IsActive:true,
    PropertyName:r.property, OwnerName:r.owner, ManagerName:r.manager,
    LeaseEndSnapshot:r.leaseEnd,
    ModifiedBy2:S.me.name, ModifiedOn:new Date().toISOString()
  };
  if(r.p?.spId){
    await patchItem(L_PIPE, r.p.spId, {...base, ...fields});
  }else{
    const created = await createItem(L_PIPE, {
      Title:`${r.property} ${r.unitLabel}`.slice(0,255),
      CurrentRentSnapshot:r.currentRent, ...base, ...fields
    });
    r.p = {...base, ...fields, spId:created.id};
    S.pipe.push(r.p);
  }
}

/* The slate being edited in the open modal. Held outside S so an abandoned
   modal never leaves half-priced offers on the record. */
let _modalOffers = [];

function offerEditor(r){
  if(!_modalOffers.length) return `<div class="fhint">No rate could be suggested — this unit has no current rent in AppFolio.</div>`;
  return `<table class="offtbl"><tbody>${_modalOffers.map((o,i)=>`
    <tr>
      <td class="offterm">
        ${o.months===0||o.mtm
          ? `<b>Month-to-month</b>`
          : `<b>${o.months} months</b>`}
        ${o.peak?`<span class="bdg b-gold" title="This term ends in peak leasing season">★ peak</span>`:""}
        ${o.months===12?`<span class="bdg b-gr">standard</span>`:""}
      </td>
      <td class="offend">${o.months && r.leaseEnd ? "ends "+fmtDate(addMonths(r.leaseEnd, o.months)) : ""}</td>
      <td class="offrent">
        <input type="number" step="5" min="0" class="rent-in" value="${o.rent}"
               oninput="setOfferRent(${i}, this.value, ${r.currentRent})">
      </td>
      <td class="offdelta" id="offd-${i}">${deltaLabel(r.currentRent, o.rent)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function offerHint(r){
  if(r.mtmOnly) return `One month-to-month rate: current rent plus the ${money(num(r.pol.MTMFee))} MTM fee.`;
  const pk = _modalOffers.find(o=>o.peak);
  const base = `Policy target is +${r.pol.TargetIncreasePct}% (${money(r.suggested)}); `
    + `9 months carries a ${money(num(r.pol.ShortTermPremium))} premium.`;
  return pk
    ? base + ` The ${pk.months}-month option is sized so the next expiration lands in `
           + `${monthNames(r.pol.PeakMonths)} — your peak leasing season.`
    : base + ` A fixed term already expires in peak season, so there's no third option.`;
}

function setOfferRent(i, v, current){
  if(!_modalOffers[i]) return;
  _modalOffers[i].rent = Number(v)||0;
  const el = document.getElementById("offd-"+i);
  if(el) el.innerHTML = deltaLabel(current, _modalOffers[i].rent);
}

function toggleMTMOnly(uid, on){
  const r = byUid(uid); if(!r) return;
  r.mtmOnly = on;                       // provisional; persisted on save
  _modalOffers = buildOffers(r).map(o=>({...o}));
  const box = document.getElementById("m-offers");
  if(box) box.innerHTML = offerEditor(r);
  const hint = document.getElementById("m-offers-hint");
  if(hint) hint.innerHTML = offerHint(r);
  const lbl = document.getElementById("m-offers-lbl");
  if(lbl) lbl.textContent = on ? "Month-to-month rate" : "Rates you're proposing";
}

async function doTakeToOwner(uid){

function ownerOpt(val,title,desc){
  return `<label class="radio-opt" onclick="pickOwner(this,'${val}')">

  document.querySelectorAll(".radio-opt").forEach(o=>o.classList.remove("on"));
  el.classList.add("on");

async function doOwnerReply(uid){
  const r = byUid(uid); if(!r) return;
  const sel = document.querySelector("input[name=oout]:checked");
  if(!sel){ toast("Pick what the owner said.", true); return; }
  const outcome = sel.value;
  const notes = document.getElementById("m-onotes").value||"";

  const f = { OwnerOutcome:outcome, OwnerNotes:notes, OwnerRespondedOn:todayStr() };

  if(outcome==="Approved"){
    f.Stage = "Awaiting Approval";
    f.FinalRent = (r.headline || r.offers[0])?.rent ?? r.suggested;
  }else if(outcome==="Countered"){
    const offers = _modalOffers.filter(o=>o.rent > 0);
    if(!offers.length){ toast("Enter at least one rate the owner will accept.", true); return; }
    const head = offers.find(o=>o.months===12) || offers[0];
    f.Stage = "Awaiting Approval";
    f.OffersJSON = JSON.stringify(offers);
    f.OwnerCounterRent = head.rent;
    f.FinalRent = head.rent;
    f.ProposedTermMonths = head.months;
  }else if(outcome==="Declined"){
    f.Stage = "Non-Renew";
    f.NonRenewReason = "Owner declined to renew";
  }else{
    /* No response: stays with the owner, and is flagged so it surfaces on the
       approver's board rather than quietly ageing on the PM's. */
    f.Stage = "With Owner";
    f.Escalated = true;
    f.EscalatedOn = todayStr();
    f.OwnerRespondedOn = "";
  }
  closeModal();
  await withBusy("Saving…", async ()=>{
    await savePipe(r, f);
    await reload();
    toast(outcome==="Declined" ? `${r.unitLabel} marked non-renew.`
        : outcome==="No Response" ? `${r.unitLabel} escalated.`
        : `${r.unitLabel} sent for approval.`);
  });
}

/* Copy a ready-to-paste summary of an owner's units, so the PM can drop it
   straight into their own Outlook. The app deliberately does not send mail --
   owner outreach happens in Outlook and is logged back here. */
function copyOwnerBrief(owner){
  const rows = S.renewals.filter(r=>r.owner===owner && r.openWork && inScope(r));
  if(!rows.length) return;
  const lines = rows.map(r=>{
    const bits = [
      `${r.unitLabel} — ${r.resident||"vacant"}`,
      `  Lease ends: ${r.isMTM?"month-to-month":fmtDate(r.leaseEnd)}`,
      `  Current rent: ${money(r.currentRent)}`,
      r.marketRent ? `  Market rent: ${money(r.marketRent)}` : null,
      ...(r.offers.length
        ? r.offers.map(o=>{
            const d = o.rent - r.currentRent;
            const pct = (d/(r.currentRent||1)*100).toFixed(1);
            return `  ${termLabel(o)}: ${money(o.rent)} (${d>=0?"+":""}${money(d)}, ${d>=0?"+":""}${pct}%)`
                 + (o.peak ? "   [ends in peak leasing season]" : "");
          })
        : []),
      r.unitNote ? `  Notes: ${r.unitNote}` : null
    ].filter(Boolean);
    return bits.join("\n");
  });
  const text = `Renewal proposals — ${owner}\n\n${lines.join("\n\n")}\n\n`
    + `Prepared by ${S.me.name}, ${fmtDate(todayStr())}.\n`
    + `Please confirm these rates and terms so we can send the renewal offers. `
    + `Where more than one term is listed, the resident chooses.`;

  navigator.clipboard.writeText(text)
    .then(()=>toast(`Copied ${rows.length} unit${rows.length>1?"s":""} for ${owner}. Paste into Outlook.`))
    .catch(()=>toast("Couldn't copy — your browser blocked clipboard access.", true));
}

function exportCSV(){
  const rows = S.renewals.filter(inScope).filter(matchFilters);
  const cols = [
    ["Property","property"],["Unit","unitLabel"],["Resident","resident"],["Owner","owner"],
    ["Manager","manager"],["Portfolio","portfolio"],["Lease status", r=>r.u.LeaseStatus],
    ["Occupied", r=>r.isOccupied?"Yes":"No"],
    ["Lease end","leaseEnd"],["MTM", r=>r.isMTM?"Yes":"No"],
    ["AppFolio renewal", "afStatus"],["Stage", r=>r.openWork?r.stage:""],
    ["Current rent","currentRent"],["Market rent","marketRent"],
    ["Proposed", r=>r.proposed??""],["Owner counter", r=>r.counter??""],["Final", r=>r.final??""],
    ["Past due", r=>r.u.PastDue],["Late count", r=>r.u.LateCount],["NSF", r=>r.u.NSFCount],
    ["Send by","deadline"],["Owner contacted", r=>r.p?.OwnerContactedOn||""],
    ["Owner outcome", r=>r.p?.OwnerOutcome||""],["Sent on", r=>r.p?.SentOn||""]
  ];
  const cell = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = [cols.map(c=>cell(c[0])).join(",")]
    .concat(rows.map(r=>cols.map(c=>cell(typeof c[1]==="function"?c[1](r):r[c[1]])).join(",")))
    .join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = `renewals_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
