function openModal({title, sub, body, actions}){
  document.getElementById("modal").innerHTML = `
    <div class="mhead"><div class="mtitle">${esc_(title)}</div>
      ${sub?`<div class="msub">${esc_(sub)}</div>`:""}</div>
    <div class="mbody">${body}</div>
    <div class="mfoot">${actions}</div>`;
  document.getElementById("mask").classList.add("on");
}
function closeModal(){ document.getElementById("mask").classList.remove("on"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* Reload from SharePoint after a write, so the screen reflects what was
   actually stored rather than what we hoped was stored. */
async function reload(){
  const [units, pipe] = await Promise.all([listAll(L_UNITS), listAll(L_PIPE)]);
  S.units = units.map(i=>i.fields);
  S.pipe  = pipe.map(i=>({...i.fields, spId:i.id}));
  buildModel();
  render();
}

async function withBusy(msg, fn){
  if(S.busy) return;
  S.busy = true; showLoad(msg);
  try{ await fn(); }
  catch(e){
    console.error(e);
    const s = e.status;
    toast(s===403 ? "Save failed (403) — you need Contribute permission on the NS_Renewal_Pipeline list."
        : s===404 ? "Save failed (404) — the SharePoint list is missing. Run provision-renewal-lists.ps1."
        : "Save failed: " + String(e.message||e).slice(0,140), true);
  }
  finally{ S.busy=false; hideLoad(); }
}

/* Metric-card click handlers, rebuilt each render. Held in a registry rather
   than hung off `window`, which leaked a fresh global on every single render. */
let _mcHandlers = {};
let _mcSeq = 0;
function mcFire(k){ _mcHandlers[k]?.(); }

function mc(label, value, cls="", sub="", selected=false, onclick=null){
  let attr = "";
  if(onclick){
    const k = "h" + (++_mcSeq);
    _mcHandlers[k] = onclick;
    attr = ` onclick="mcFire('${k}')"`;
  }
  return `<div class="mc ${onclick?"click":""} ${selected?"sel":""}"${attr}>
    <div class="mcl">${esc_(label)}</div>
    <div class="mcv ${cls}">${typeof value==="number"?value:esc_(String(value))}</div>
    ${sub?`<div class="mcs">${esc_(sub)}</div>`:""}</div>`;
}

function showLoad(t){ document.getElementById("load-txt").textContent=t||"Loading…";
                      document.getElementById("load").classList.add("on"); }
function hideLoad(){ document.getElementById("load").classList.remove("on"); }
let _toastT;
function toast(msg, err=false){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on" + (err?" err":"");
  clearTimeout(_toastT); _toastT = setTimeout(()=>t.className="toast", err?5000:3200);
}

/* ══════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════ */
function esc_(s){ return String(s??"").replace(/[&<>"']/g, c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* For values interpolated into an inline JS string literal in an attribute. */
function jsq(s){ return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;"); }

function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }

/* Parse JSON we stored ourselves, falling back rather than throwing. A single
   malformed OffersJSON row must not take the whole board down with it. */
function safeJSON(str, fallback){
  try{ return str ? JSON.parse(str) : fallback; }
  catch(e){ console.warn("safeJSON: bad JSON, using fallback:", String(str).slice(0,80)); return fallback; }
}
function truthy(v){ return v===true || v==="true" || v===1 || v==="1"; }

function money(n){
  const v = Number(n)||0;
  const s = Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:0, maximumFractionDigits:0});
  return (v<0?"−$":"$") + s;
}
function fmtNum(v){ return (v===undefined||v===null||v==="") ? "—" : String(v); }

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
/* Dates are plain YYYY-MM-DD strings throughout -- parsed as local noon so a
   timezone offset can never roll one onto the previous day. */
function parseD(s){
  const m = String(s||"").slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0) : null;
}
function daysBetween(from, to){
  const a = parseD(from), b = parseD(to);
  if(!a||!b) return null;
  return Math.round((b-a)/86400000);
}
function addDays(s, n){
  const d = parseD(s); if(!d) return "";
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
/* Add whole months, clamping the day so 31 Jan + 1 month is 28/29 Feb rather
   than rolling into March -- lease terms are month counts, not day counts. */
function addMonths(str, n){
  const d = parseD(str); if(!d) return "";
  const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1, 12, 0, 0);
  const lastDay = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, lastDay));
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}

const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthNames(months){
  if(!months?.length) return "—";
  return months.slice().sort((a,b)=>a-b).map(m=>MONTH_ABBR[m-1]).join("/");
}

function fmtDate(s){
  const d = parseD(s); if(!d) return "—";
  return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}/${String(d.getFullYear()).slice(2)}`;
}
function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function deadlineLabel(d){
  if(d==null || d===99999) return "no date";
  if(d < 0)  return `${Math.abs(d)}d overdue`;
  if(d === 0) return "due today";
  return `${d}d left`;
}
function tenure(moveIn){
  const d = parseD(moveIn); if(!d) return "—";
  const months = Math.round((new Date()-d)/(86400000*30.44));
  if(months < 12) return `${months} month${months===1?"":"s"}`;
  const y = Math.floor(months/12), m = months%12;
  return `${y} yr${y===1?"":"s"}${m?` ${m} mo`:""}`;
}
function paymentSummary(r){
  const bits = [];
  if(num(r.u.PastDue) > 0) bits.push(`${money(num(r.u.PastDue))} past due`);
  if(num(r.u.LateCount) > 0) bits.push(`${num(r.u.LateCount)} late`);
  if(num(r.u.NSFCount) > 0) bits.push(`${num(r.u.NSFCount)} NSF`);
  return bits.length ? bits.join(" · ") : "clean";
}
